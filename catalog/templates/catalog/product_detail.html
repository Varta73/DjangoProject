{% extends 'catalog/home.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col">
          <div class="card shadow-sm">
              <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal text-center">Карточка продукта</h4>
                </div>
              </div>


              <div class="card-body">
                  <img src="{{ product.image | media_filter }}" width=" 350" height=" 270"/>>
              <p class="card-text"> Название: {{object.name}}</p>
              <p class="card-text"> Категория: {{object.category}}</p>
              <p class="card-text"> Описание: {{object.description|truncatechars:100}}</p>
              <p class="card-text"> Цена: {{object.price}} руб.</p>


              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a class="btn btn-primary" href="{% url 'catalog:product_list' %}" role="button">На главную</a>
                </div>
              </div>
            </div>
          </div>
        </div>
    </div>
</div>
{% endblock %}
